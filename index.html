<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área de Miembros · Bordado Perfecto Infantil</title>
  <meta name="description" content="Área de miembros completa con más de 3.700 matrices de bordado infantil organizadas para tu máquina bordadora.">
  <meta name="theme-color" content="#F47291">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧸</text></svg>">
  
  <!-- Fuentes Google: Fredoka (Títulos tiernos) y Nunito (Lectura acogedora) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Hoja de Estilos -->
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

  <!-- Backdrop para Drawer Mobile -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <div class="app-container">

    <!-- ══ BARRA LATERAL (DESKTOP / GAVETA MOBILE) ══ -->
    <aside class="sidebar" id="sidebar">
      
      <!-- Botón Cerrar Mobile -->
      <button class="drawer-close-btn js-close-drawer" id="btnCloseDrawer" aria-label="Cerrar menú" title="Cerrar menú">✕</button>

      <!-- Logo & Marca Artesanal -->
      <div class="brand-wrapper">
        <div class="brand-icon-box" aria-hidden="true">
          🧸
        </div>
        <span class="brand-title">Bordado<br>Perfecto</span>
        <span class="brand-badge">Rincón Infantil ✨</span>
      </div>

      <!-- Menú Principal de Navegación -->
      <nav class="nav-menu" id="navMenu">
        <button class="nav-item active js-nav" data-view="home">
          <span class="icon">🏠</span>
          <span>Inicio</span>
        </button>

        <button class="nav-item js-nav" data-view="categories">
          <span class="icon">🧸</span>
          <span>Categorías</span>
        </button>

        <button class="nav-item js-nav" data-view="collections">
          <span class="icon">📁</span>
          <span>Colecciones</span>
        </button>

        <button class="nav-item js-nav" data-view="favorites">
          <span class="icon">♥</span>
          <span>Mis Favoritos</span>
          <span class="badge-count js-fav-count"></span>
        </button>

        <button class="nav-item js-nav" data-view="help">
          <span class="icon">🪡</span>
          <span>Cómo Bordar</span>
        </button>

        <button class="nav-item js-open-acervo-modal" style="color:var(--rose-dark);background:var(--rose-light);">
          <span class="icon">📦</span>
          <span>Descargar Todo (ZIP)</span>
        </button>
      </nav>

      <!-- Tarjeta de Máquina Configurada -->
      <div class="sidebar-machine-card">
        <div class="smc-top">
          <span class="smc-label">Tu Máquina</span>
          <span class="smc-fmt js-active-format">PES</span>
        </div>
        <button class="smc-btn js-open-machine-modal">
          Cambiar Marca / Formato
        </button>
      </div>

      <!-- Botón de Sonidos Tiernos -->
      <button class="sound-toggle-btn js-toggle-sound" title="Activar o desactivar sonidos tiernos">
        <span class="js-sound-label">Sonidos: Activos 🔔</span>
      </button>

      <!-- Pie de la Barra Lateral -->
      <div class="sidebar-footer">
        <b>Acceso Vitalicio Garantizado</b><br>
        Sin mensualidades · Todas las matrices desbloqueadas
      </div>
    </aside>

    <!-- ══ ÁREA DE CONTENIDO PRINCIPAL ══ -->
    <main class="main-content">

      <!-- Topbar Mobile -->
      <header class="mobile-topbar">
        <button class="btn-icon" id="btnOpenMenu" aria-label="Abrir menú de navegación">
          ☰
        </button>
        <div class="mobile-brand">
          🧸 <span>Bordado</span> Perfecto
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn-icon js-open-acervo-modal" aria-label="Descargar Catálogo Completo" title="Descargar Todo">
            <span>📦</span>
          </button>
          <button class="btn-icon js-open-machine-modal" aria-label="Cambiar formato de máquina" title="Tu Máquina">
            <span class="js-active-format" style="font-size:0.78rem;font-weight:800;">PES</span>
          </button>
        </div>
      </header>

      <div class="content-wrapper">

        <!-- Barra de Búsqueda Global Instantánea -->
        <div style="margin-bottom: 24px;">
          <form class="search-container" id="searchForm" autocomplete="off">
            <span class="search-icon" aria-hidden="true">🔍</span>
            <input 
              type="search" 
              class="search-input" 
              id="searchInput" 
              placeholder="Buscar por oso, león, safari, flor, alfabeto, nombre, 10x10..." 
              aria-label="Buscar matrices de bordado"
            >
            <button type="button" class="search-clear" id="searchClear" aria-label="Limpiar búsqueda">&times;</button>
            <button type="submit" class="btn-search-action">
              <span>Buscar</span>
            </button>
          </form>

          <!-- Chips de Sugerencias Rápidas -->
          <div class="quick-tags">
            <span class="quick-tag-label">Ideas rápidas:</span>
            <button type="button" class="quick-tag js-quick-search" data-query="oso">🧸 Ositos</button>
            <button type="button" class="quick-tag js-quick-search" data-query="safari">🦁 Safari</button>
            <button type="button" class="quick-tag js-quick-search" data-query="bebe">🍼 Bebé y Ajuar</button>
            <button type="button" class="quick-tag js-quick-search" data-query="flor">🌸 Jardín</button>
            <button type="button" class="quick-tag js-quick-search" data-query="alfabeto">🔤 Alfabetos</button>
            <button type="button" class="quick-tag js-quick-search" data-query="dino">🦕 Dinosaurios</button>
            <button type="button" class="quick-tag js-quick-search" data-query="princesa">👑 Princesas</button>
          </div>
        </div>

        <!-- Punto de Inyección de Vistas Dinámicas (SPA) -->
        <div id="view"></div>

      </div>
    </main>

  </div>

  <!-- ══ MODAL DE FICHA TÉCNICA DE LA MATRIZ ══ -->
  <div class="modal-overlay" id="modalMatrix" role="dialog" aria-modal="true">
    <div class="modal-window" id="modalMatrixWindow"></div>
  </div>

  <!-- ══ MODAL SELECTOR DE MÁQUINA BORDADORA ══ -->
  <div class="modal-overlay" id="modalMachine" role="dialog" aria-modal="true">
    <div class="modal-window" id="modalMachineWindow"></div>
  </div>

  <!-- Botón Flotante Volver Arriba -->
  <button class="btn-back-to-top js-back-to-top" id="btnBackToTop" aria-label="Volver arriba" title="Volver arriba">▲</button>

  <!-- Barra de Navegación Inferior para Móvil -->
  <nav class="mobile-bottom-nav">
    <button class="mbn-item js-nav active" data-view="home">
      <span class="mbn-icon">🏠</span>
      <span class="mbn-label">Inicio</span>
    </button>
    <button class="mbn-item js-nav" data-view="categories">
      <span class="mbn-icon">🧸</span>
      <span class="mbn-label">Categorías</span>
    </button>
    <button class="mbn-item js-nav" data-view="collections">
      <span class="mbn-icon">📁</span>
      <span class="mbn-label">Colecciones</span>
    </button>
    <button class="mbn-item js-nav" data-view="favorites">
      <span class="mbn-icon">♥</span>
      <span class="mbn-label">Favoritos</span>
    </button>
    <button class="mbn-item js-open-menu-drawer" id="btnBottomMenu" aria-label="Abrir menú completo">
      <span class="mbn-icon">☰</span>
      <span class="mbn-label">Menú</span>
    </button>
  </nav>

  <!-- Scripts: Catálogo de Datos Completo y Controlador -->
  <script src="catalogo.js"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
